services:
    web:
        container_name: "${PROJECT_NAME}_webserver"
        image: nginx:latest
        ports:
            - "${PORT_WEBSERVER}:8082"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./moodlephp.ini:/usr/local/etc/php/conf.d/my_apache2_php.ini
            - ./app:/app
        restart: always

    php:
        container_name: "${PROJECT_NAME}_php"
        build:
            context: .
            dockerfile: PHP.Dockerfile
        volumes:
            - ./app:/app
        restart: always
        extra_hosts:
            - "api-nonprod.gla.ac.uk:130.209.102.228"

    cron:
        container_name: "${PROJECT_NAME}_cron"
        build:
            context: .
            dockerfile: PHP.Dockerfile
        volumes:
            - ./app:/app
        restart: always

    mysql:
        container_name: "${PROJECT_NAME}_mysql"
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: '${DATABASE_ROOT_PASSWORD}'
            MYSQL_USER: '${DATABASE_USER}'
            MYSQL_PASSWORD: '${DATABASE_PASSWORD}'
            MYSQL_DATABASE: '${DATABASE_NAME}'
        restart: always
        volumes:
            - mysqldata:/var/lib/mysql
        ports:
            - "${PORT_DATABASE}:3306"

    redis:
        container_name: "${PROJECT_NAME}_redis"
        image: redis:latest
        command: redis-server --save "" --appendonly no
        restart: always

    redisinsight:
        image: redis/redisinsight:latest
        container_name: "${PROJECT_NAME}_insight"
        ports:
            - '${PORT_INSIGHT}:5540'
        environment:
            RI_APP_HOST: 0.0.0.0
        volumes:
            - ./redisinsight:/data

    mailhog:
        image: mailhog/mailhog
        container_name: "${PROJECT_NAME}_mailhog"
        ports:
            - '${PORT_MAILHOG}:8025'

volumes:
    mysqldata: {}

